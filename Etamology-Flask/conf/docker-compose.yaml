version: '3.8'

services:
  etamology-app:
    build:
      context: ./Algic-Etamology-Flask  # Target your split git submodule directory path
      dockerfile: conf/Dockerfile
    container_name: etamology_stack
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - MY_DOMAIN=${MY_DOMAIN:-localhost}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-admin@localhost.local}
    volumes:
      - etamology_data:/var/www/Etamology/data
      - letsencrypt_certs:/etc/letsencrypt
      
      # ── Zero Friction Volume Mounting Mapping Strategy ──
      # 1. Mounts your live XSLT sheets straight from your master linguistics-suite directory
      - ./XSLT/linguistics-suite/xslt:/var/www/Etamology/xslt:ro
      
      # 2. Mounts your custom utilities directory side-by-side so transmog.py can use them
      - ./scripts:/var/www/Etamology/scripts:ro

volumes:
  etamology_data:
  letsencrypt_certs:

